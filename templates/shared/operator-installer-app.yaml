{{- if .Values.operators }}
{{- $operatorInstaller := (.Values.platform).operatorInstaller }}
{{- $installerRepoURL := (required "operatorInstaller.repoURL is required" $operatorInstaller.repoURL) }}
{{- $installerTargetRevision := (default "main" $operatorInstaller.targetRevision) }}
{{- $installerPath := (default "charts/operators-installer" $operatorInstaller.path) }}
{{- $platformSyncPolicy := (default false ((.Values.platform).argocd).syncPolicy) }}
{{- $platformVersion := (required "platform.version is required" (.Values.platform).version) }}
{{- range $operator := .Values.operators }}
{{- $customSyncPolicy := (default false (($operator).syncPolicy)) }}
{{- if $operator.enabled }}
{{- /*
  Helm's `default` treats boolean false as empty — never use it for bools.
  hasKey + explicit fallback preserves createOperatorGroup: false (e.g. openshift-operators).
*/ -}}
{{- $createOG := true -}}
{{- if hasKey $operator "createOperatorGroup" -}}
{{- $createOG = $operator.createOperatorGroup -}}
{{- end -}}
{{- $createNS := false -}}
{{- if hasKey $operator "createNamespace" -}}
{{- $createNS = $operator.createNamespace -}}
{{- end -}}
{{- $targetOwnNS := false -}}
{{- if hasKey $operator "targetOwnNamespace" -}}
{{- $targetOwnNS = $operator.targetOwnNamespace -}}
{{- end -}}
{{- $approveHook := false -}}
{{- if hasKey $operatorInstaller "approveManualInstallPlanViaHook" -}}
{{- $approveHook = $operatorInstaller.approveManualInstallPlanViaHook -}}
{{- end -}}
{{- $approval := ($operator.installPlanApproval | default $operatorInstaller.installPlanApproval | default "Manual") -}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: {{ default $operator.name $operator.appname }}
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    platform/chart: operators-installer
    platform/version: {{ $platformVersion }}
spec:
  destination:
    namespace: {{ $operator.destination.namespace }}
    server: {{ $operator.destination.server | default "https://kubernetes.default.svc" }}
  project: default
  sources:
    - helm:
        valuesObject:
          approveManualInstallPlanViaHook: {{ $approveHook }}
          createOperatorGroup: {{ $createOG }}
          {{- if $createOG }}
          operatorGroups:
            - name: {{ $operator.operatorGroupName }}
              namespace: {{ default $operator.operatorGroupName $operator.operatorGroupNamespace }}
              createNamespace: {{ $createNS }}
              targetOwnNamespace: {{ $targetOwnNS }}
          {{- end }}
          {{- if $operator.operators }}
          operators: {{ $operator.operators | toYaml | nindent 12 }}
          {{ else }}
          operators:
            - name: {{ $operator.name }}
              channel: {{ $operator.channel }}
              csv: {{ $operator.csv }}
              source: {{ $operator.source }}
              installPlanApproval: {{ $approval }}
              sourceNamespace: openshift-marketplace
              {{- if $operator.installPlanApproverWaitLoopInsideJob }}
              installPlanApproverWaitLoopInsideJob: {{ $operator.installPlanApproverWaitLoopInsideJob }}
              {{- end }}
              {{- if $operator.installPlanApproverRetries }}
              installPlanApproverRetries: {{ $operator.installPlanApproverRetries }}
              {{- end }}
              {{- if $operator.installPlanApproverActiveDeadlineSeconds }}
              installPlanApproverActiveDeadlineSeconds: {{ $operator.installPlanApproverActiveDeadlineSeconds }}
              {{- end }}
              {{- if $operator.config }}
              config: {{ $operator.config | toYaml | nindent 16 }}
              {{- end }}
          {{ end }}

      path:  {{ $installerPath }}
      repoURL: {{ $installerRepoURL }}
      targetRevision: {{ $installerTargetRevision }}
{{- if $customSyncPolicy }}
  syncPolicy: {{ $customSyncPolicy | toYaml | nindent 4 }}
{{- else if $platformSyncPolicy }}
  syncPolicy: {{ $platformSyncPolicy | toYaml | nindent 4 }}
{{- else }}
  syncPolicy: {}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
